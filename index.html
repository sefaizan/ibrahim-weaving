<script>
  // Applies the saved theme before first paint, straight from localStorage (not the app's
  // window.storage-backed DATA, which loads async later) — this is a pure device/UI
  // preference, not ledger data, so it isn't part of Backup/Restore either. Wrapped in
  // try/catch since localStorage can throw in some embedded/locked-down webviews.
  try{
    var t = localStorage.getItem('khata-theme');
    if(t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    // Device preference: log tables as compact cards on phones (default) or classic tables.
    if(localStorage.getItem('khata-logs') === 'table') document.documentElement.setAttribute('data-logs', 'table');
  }catch(e){}
</script>

<style>

    --paper-dim:#E1E4E8;

    --ink-soft:#626B72;

    --shape-md: 14px;

    --warn-bg-2:#F1DAD1;
    --tonal-edit:#DCEDEB;
    --tonal-edit-hover:#CFE3E1;
    --tonal-del:#F7E0DB;
    --tonal-del-hover:#F0CCC3;
    --tonal-progress-bg:#F3DFCB;
    --tonal-progress-ink:#8A4A1D;
    --tonal-receipt-hover:#EACBA0;
  }
  /* Dark theme — same tokens, different values, toggled via [data-theme="dark"] on <html>
     (see the small inline script right after <head> for FOUC-free early apply, and the
     Appearance toggle in Settings for switching it — see wirePanel(id==='settings')). Every
     rule in this file is written against these variables, so this block is almost the whole
     of dark mode; only a handful of literal colors below it needed their own override. */
  :root[data-theme="dark"]{
    color-scheme: dark;
    --paper:#15181B;
    --paper-dim:#1D2226;
    --ink:#E7EAEC;
    --ink-soft:#9AA3AA;
    --line:#2B3136;
    --field-border:#3C444A;
    --rust:#4A9A93;
    --rust-deep:#2E6E68;
    --rust-tonal:#1C302E;
    --gold:#D98A4B;
    --green:#5FBE8D;
    --red:#E2685A;
    --card:#1E2327;
    --elev-1: 0 1px 2px rgba(0,0,0,0.5), 0 1px 3px 1px rgba(0,0,0,0.4);
    --elev-2: 0 1px 2px rgba(0,0,0,0.55), 0 2px 6px 2px rgba(0,0,0,0.45);
    --elev-3: 0 4px 8px -2px rgba(0,0,0,0.6), 0 2px 4px rgba(0,0,0,0.5);
    --warn-bg-1:#3A2A22;
    --warn-bg-2:#3A2A22;
    --tonal-edit:#1C302E;
    --tonal-edit-hover:#24403C;
    --tonal-del:#3A2320;
    --tonal-del-hover:#4A2C28;
    --tonal-progress-bg:#3A2C1C;
    --tonal-progress-ink:#E0A870;
    --tonal-receipt-hover:#4A3826;
  }
  html[data-theme="dark"]{ background:#0B0D0F; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{ background:#C7CDD2; }

    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Roboto','Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;

  h1,h2,h3{ font-family:'Roboto',sans-serif; font-weight:700; margin:0; letter-spacing:0; }

  /* App shell — full-bleed edge-to-edge on an actual phone; on wider screens it collapses to

  .app-shell{ position:relative; min-height:100vh; background:var(--paper); overflow-x:clip; } /* clip (not hidden) so the sticky header can stick to the screen */
  @media (min-width:700px){
    html{ display:flex; justify-content:center; }

      display:flex; flex-direction:column; overflow:hidden;

    .scrim, nav.tabs{ position:absolute; }

  /* Status bar — mimics the OS status strip so the app reads as installed/full-screen even
     inside a browser preview. On a real installed PWA the system draws its own on top of

  .statusbar{
    height:30px; padding:0 20px; display:flex; align-items:center; justify-content:space-between;

  @media (max-width:699px){ .statusbar{ display:none; } }
  header.appbar{
    position:sticky; top:0; z-index:40; flex:0 0 auto;
    background:linear-gradient(165deg, var(--rust), var(--rust-deep));
    color:#fff; height:calc(var(--appbar-h) + env(safe-area-inset-top, 0px)); padding:env(safe-area-inset-top, 0px) 6px 0 4px;
    display:flex; align-items:center; gap:2px;
    box-shadow: var(--elev-2);

  .icon-btn{
    position:relative; overflow:hidden; flex:0 0 auto; width:44px; height:44px; border-radius:50%;

    display:flex; align-items:center; justify-content:center;

  .icon-btn:hover{ background:rgba(255,255,255,0.12); }

  .appbar-titles h1{ font-size:19px; font-weight:700; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .appbar-titles .sub{ color:rgba(255,255,255,0.8); font-size:11px; font-weight:500; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* Off-canvas navigation drawer — the real <nav id="tabs"> element from the original build,
     restyled from a horizontal chip row into a Material modal drawer. renderNav() still just
     replaces its innerHTML with one button per TABS entry; only the container CSS changed. */
  .scrim{
    position:fixed; inset:0; z-index:49; background:rgba(15,12,30,0.45);
    opacity:0; pointer-events:none; transition:opacity 180ms ease;
  }
  .scrim.open{ opacity:1; pointer-events:auto; }
  nav.tabs{
    position:fixed; top:0; bottom:0; left:0; z-index:50; width:296px; max-width:84vw;
    background:var(--card); box-shadow:var(--elev-3); overflow-y:auto; -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;

    padding:8px 0 20px; display:block;
  }
  nav.tabs.open{ transform:translateX(0); }
  /* PIN Lock overlay — sits above everything (drawer included) so the ledger is fully
     covered and unreachable until the correct PIN is entered. Mounted directly on <body>,
     outside #appShell, so it survives even if #appShell's own content gets re-rendered. */
  .pin-lock-overlay{
    position:fixed; inset:0; z-index:1000; background:linear-gradient(165deg, var(--rust), var(--rust-deep));
    color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center;
    justify-content:safe center; /* ignored where unsupported; stops tall content (e.g. with the keyboard open) being cut off at the top */
    gap:22px; padding:24px; padding-top:calc(24px + env(safe-area-inset-top, 0px)); padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px)); text-align:center;
    overflow-y:auto;
  }
  .pin-lock-overlay .mark{ font-size:40px; }
  .pin-lock-overlay h1{ font-size:19px; font-weight:700; }
  .pin-lock-overlay p.hint{ font-size:13px; color:rgba(255,255,255,0.82); margin:0; max-width:280px; }
  .pin-dots{ display:flex; gap:16px; margin:6px 0; }
  .pin-dots span{
    width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,0.7);
    background:transparent; transition:background 120ms ease;
  }
  .pin-dots span.filled{ background:#fff; }
  .pin-dots.shake{ animation:pinShake 380ms ease; }
  @keyframes pinShake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(8px);} 60%{transform:translateX(-6px);} 80%{transform:translateX(6px);} }
  .pin-keypad{ display:grid; grid-template-columns:repeat(3,64px); gap:14px; }
  .pin-key{
    width:64px; height:64px; border-radius:50%; border:1px solid rgba(255,255,255,0.35);
    background:rgba(255,255,255,0.08); color:#fff; font-size:22px; font-weight:600;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .pin-key:hover{ background:rgba(255,255,255,0.18); }
  .pin-key.ghost-key{ border:none; background:transparent; font-size:14px; }
  .pin-lock-overlay .error-text{ color:#FFD9CC; font-size:13px; min-height:18px; }
  .pin-lock-overlay .link-btn{
    background:none; border:none; color:rgba(255,255,255,0.85); text-decoration:underline;
    font-size:13px; cursor:pointer; padding:6px;
  }
  .pin-lock-overlay .field{ width:min(280px,84vw); text-align:left; }
  .pin-lock-overlay .field input{ background:rgba(255,255,255,0.92); }
  .pin-lock-overlay .field label{ color:rgba(255,255,255,0.9); }
  .pin-lock-overlay .primary, .pin-lock-overlay .ghost{ width:min(280px,84vw); }
  .drawer-head{
    padding:calc(26px + env(safe-area-inset-top, 0px)) 20px 18px; background:linear-gradient(165deg, var(--rust), var(--rust-deep)); color:#fff;
    margin-bottom:8px;
  }
  .drawer-head .mark{
    width:42px; height:42px; border-radius:12px; background:rgba(255,255,255,0.18);

  }
  .drawer-head .mark{ background:none; padding:0; }
  .drawer-head .mark img{ width:100%; height:100%; display:block; border-radius:12px; }
  .pin-lock-overlay .mark img{ width:64px; height:64px; display:block; border-radius:16px; }
  .drawer-head .appname{ font-size:17px; font-weight:700; }
  .drawer-head .appsub{ font-size:11.5px; color:rgba(255,255,255,0.78); margin-top:1px; }
  nav.tabs button{
    position:relative; overflow:hidden; width:calc(100% - 24px); margin:1px 12px; display:flex; align-items:center; gap:16px;
    background:transparent; border:none; border-radius:var(--shape-lg); padding:11px 16px; font-size:13.5px; font-weight:600;
    color:var(--ink); cursor:pointer; white-space:nowrap; text-align:left; font-family:inherit;
  }
  nav.tabs button .icon{ font-size:20px; color:var(--ink-soft); flex:0 0 auto; }
  nav.tabs button.active{ color:var(--rust-deep); background:var(--rust-tonal); }
  nav.tabs button.active .icon{ color:var(--rust-deep); }
  nav.tabs button:hover:not(.active){ background:var(--paper-dim); }
  main{ padding:16px 14px 90px; max-width:1180px; margin:0 auto; }
  .panel{ display:none; }
  .panel.active{ display:block; }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--shape-md);
    padding:18px 18px; margin-bottom:14px; box-shadow: var(--elev-1);
  }
  .card h2{ font-size:15.5px; margin-bottom:14px; color:var(--ink); font-weight:700; }
  /* Card headings that used to be followed by a long explanatory paragraph now show a small
     info toggle next to the title instead — the note stays in the DOM (for search/adjacency
     purposes) but starts [hidden], and a delegated click handler (registered once, in Init)
     flips it open/closed. Keeps the card compact by default; the explanation is one tap away. */
  .card-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .card-head h2{ margin-bottom:0; }
  .info-btn{
    position:relative; overflow:hidden;
    flex:0 0 auto; width:26px; height:26px; border-radius:50%; border:none;
    background:var(--rust-tonal); color:var(--rust-deep); font-size:13px; font-weight:800; font-style:normal;
    line-height:1; cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center;
  }
  .info-btn:hover, .info-btn.active{ background:var(--rust); color:#fff; }
  .dismiss-btn{
    flex:0 0 auto; width:26px; height:26px; border-radius:50%; border:none;
    background:transparent; color:var(--ink-soft); font-size:15px; font-weight:700;
    line-height:1; cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center;
  }
  .dismiss-btn:hover{ background:rgba(0,0,0,0.08); color:var(--ink); }
  /* Slim reminder shown on every tab (except Overview/Backup, which have their own) once a
     backup is overdue. Turns red and can't be dismissed after 2 weeks. */
  .backup-strip{ display:flex; align-items:center; gap:8px 10px; flex-wrap:wrap; padding:10px 14px;
    background:var(--warn-bg-1); color:var(--ink); font-size:13px; border-bottom:1px solid var(--line); flex:0 0 auto; }
  .backup-strip:empty{ display:none; }
  .backup-strip .bs-msg{ flex:1 1 190px; font-weight:600; line-height:1.3; }
  .backup-strip .bs-btn{ margin:0; padding:8px 14px; font-size:13px; }
  .backup-strip .dismiss-btn{ position:static; }
  .backup-strip.urgent{ background:var(--red); color:#fff; }
  .backup-strip.urgent .bs-btn{ background:#fff; color:var(--red); }
  .info-note[hidden]{ display:none; }
  /* Collapsible Summary / Breakdown cards: title row is one big tap target with a chevron. */
  .summary-card .summary-head{ margin-bottom:0; }
  .summary-card.open .summary-head{ margin-bottom:14px; }
  button.summary-toggle{
    all:unset; box-sizing:border-box; flex:1 1 auto; min-width:0; min-height:36px; cursor:pointer;
    display:flex; align-items:center; justify-content:space-between; gap:10px; -webkit-tap-highlight-color:transparent;
  }
  button.summary-toggle:focus-visible{ outline:2px solid var(--rust); outline-offset:4px; border-radius:8px; }
  .summary-toggle h2{ margin:0; }
  .summary-chev{ flex:0 0 auto; width:28px; height:28px; border-radius:50%; background:var(--rust-tonal); color:var(--rust-deep); display:inline-flex; align-items:center; justify-content:center; transition:transform 160ms ease; }
  .summary-chev svg{ width:18px; height:18px; display:block; }
  .summary-card.open .summary-chev{ transform:rotate(180deg); }
  .summary-body[hidden]{ display:none; }
  .card-head + .info-note{ margin-top:-6px; }
  .grid{ display:grid; gap:12px; }
  .grid.cols-2{ grid-template-columns: repeat(2,1fr); }
  .grid.cols-3{ grid-template-columns: repeat(3,1fr); }
  .grid.cols-4{ grid-template-columns: repeat(4,1fr); }
  @media (max-width:720px){ .grid.cols-2,.grid.cols-3,.grid.cols-4{ grid-template-columns:1fr; } }
  label{ display:block; font-size:12px; font-weight:500; text-transform:none; letter-spacing:0; color:var(--ink-soft); margin-bottom:5px; }
  input, select, textarea{
    width:100%; padding:10px 12px; border:1px solid var(--field-border); border-radius:var(--shape-sm);
    font-size:14px; background:var(--paper-dim); color:var(--ink); font-family:inherit;
  }
  textarea{ resize:vertical; min-height:60px; line-height:1.4; }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--rust); outline-offset:1px; border-color:var(--rust); background:var(--card); }
  input[type="file"]{ padding:7px 8px; font-size:12.5px; color:var(--ink-soft); }
  input[type="file"]::file-selector-button{
    background:var(--rust); color:#fff; border:none; padding:7px 14px; border-radius:9px;
    font-size:12.5px; font-weight:700; font-family:inherit; cursor:pointer; margin-right:10px;
  }
  input[type="file"]::file-selector-button:hover{ background:var(--rust-deep); }
  .field{ margin-bottom:0; }
  /* Custom dropdown: every native <select> gets wrapped (see enhanceSelects() near Init) so
     tapping an option commits and closes immediately — mobile browsers otherwise open a native
     wheel picker with its own separate "Done" button, which feels like two taps for one choice.
     The real <select> stays in the DOM, fully hidden, as the actual source of truth: existing
     code that reads `.value` or listens for 'change' on it keeps working completely unchanged. */
  .sel-wrap{ position:relative; }
  .sel-wrap select{ position:absolute; inset:0; width:100%; height:100%; opacity:0; pointer-events:none; }
  .sel-fake{
    width:100%; padding:10px 34px 10px 12px; border:1px solid var(--field-border); border-radius:var(--shape-sm);
    font-size:14px; background:var(--paper-dim); color:var(--ink); font-family:inherit; text-align:left;
    cursor:pointer; position:relative; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .sel-fake:focus{ outline:2px solid var(--rust); outline-offset:1px; border-color:var(--rust); background:var(--card); }
  .sel-fake:disabled{ opacity:0.55; cursor:not-allowed; }
  .sel-fake::after{
    content:''; position:absolute; right:15px; top:50%; margin-top:-5px;
    width:8px; height:8px; pointer-events:none;
    border-right:2px solid var(--ink-soft); border-bottom:2px solid var(--ink-soft);
    transform:rotate(45deg);
  }
  .sel-list{
    position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:20; max-height:240px;
    overflow-y:auto; background:var(--card); border:1px solid var(--line); border-radius:var(--shape-sm);
    box-shadow:var(--elev-3); padding:4px;
  }
  .sel-item{ position:relative; overflow:hidden; padding:10px 12px; border-radius:8px; font-size:14px; cursor:pointer; }
  .sel-item:hover, .sel-item.selected{ background:var(--rust-tonal); }
  .sel-item.disabled{ color:var(--ink-soft); cursor:default; }
  .sel-group-label{ padding:6px 12px 2px; font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.4px; color:var(--ink-soft); }
  .value-label{
    padding:10px 12px; border:1px solid var(--field-border); border-radius:var(--shape-sm);
    background:var(--paper-dim); font-size:14px; color:var(--ink); font-weight:700;
    min-height:16.8px; line-height:1.2;
  }
  button.primary{
    position:relative; overflow:hidden;
    background:var(--rust); color:#fff; border:none; padding:11px 22px; border-radius:100px;
    font-size:13.5px; font-weight:700; cursor:pointer; margin-top:14px;
    box-shadow:var(--elev-1);
  }
  button.primary:hover{ background:var(--rust-deep); box-shadow:var(--elev-2); }
  button.ghost{
    position:relative; overflow:hidden;
    background:var(--rust-tonal); border:none; color:var(--rust-deep); padding:9px 17px;
    border-radius:100px; font-size:12.5px; cursor:pointer; font-family:inherit; font-weight:700;
  }
  button.ghost:hover{ background:var(--tonal-edit-hover); color:var(--rust-deep); }
  button.ghost:disabled{ background:var(--paper-dim); color:var(--ink-soft); cursor:default; }
  button.ghost:disabled:hover{ background:var(--paper-dim); color:var(--ink-soft); }
  /* Row actions (Receipt / Share / Edit / Remove, plus the Move arrows and Activate toggle on
     Settings lists). One flex group with a uniform gap, identical button height, and icon-only
     square buttons on phones so every column lines up row to row. Nested groups flatten into
     the outer one (display:contents) so the gap stays even however a row composes them. */
  .row-actions{ display:inline-flex; align-items:center; justify-content:flex-end; gap:8px; flex-wrap:nowrap; vertical-align:middle; }
  .row-actions .row-actions{ display:contents; }
  td:has(> .row-actions){ padding-right:14px; text-align:right; }
  button.rowbtn{
    position:relative; overflow:hidden; box-sizing:border-box; flex:0 0 auto;
    display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none;
    height:34px; min-width:34px; padding:0 12px; line-height:1; white-space:nowrap;
    border-radius:var(--shape-sm); font-size:12px; font-weight:700;
  }
  button.rowbtn .ic{ display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; line-height:1; }
  button.rowbtn .ic svg{ width:16px; height:16px; display:block; }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; padding:11px 10px; border-bottom:1px solid var(--field-border); background:var(--paper-dim); color:var(--ink-soft); font-size:11.5px; font-weight:700; text-transform:none; letter-spacing:0.2px; }
  td{ padding:11px 10px; border-bottom:1px solid var(--line); white-space:pre-wrap; }
  @media (hover:hover){ tr:hover td{ background:var(--rust-tonal); } }
  /* On phones, tables were being squeezed to the screen width, forcing every column into
     a cramped multi-line mess. Instead: let each table size itself naturally (auto width,
     no forced wrapping) and let the card scroll sideways for whatever doesn't fit — the
     standard "swipe to see more columns" pattern. The whole table scrolls as one block
     (no pinned/sticky column). */
  @media (max-width:720px){

    /* overflow-x:auto silently turns overflow-y into auto as well, so EVERY card became its own

       page-scroll swipe get caught/bounced by whichever card the finger lands on — the choppy
       scrolling on Production. Only cards that hold a bare (non-.log-scroll) table need to
       scroll sideways; every other card stays a plain box. */
    @supports selector(:has(*)){

       see more columns" scroll instead of letting its table get squished. */

  .group-label{ font-size:11px; font-weight:700; text-transform:none; letter-spacing:0.2px; color:var(--rust-deep); margin:16px 0 8px; padding-top:10px; border-top:1px dashed var(--line); }
  /* min(420px,100%): on a phone narrower than 420px a fixed minimum made every panel wider than the screen (cards cut off at the right edge) */

  /* Cards that combine a Summary (stat grid / totals) with a Log (a table that can grow to
     many rows) — Stock Position, Sales & Receivables, Receivables Aging, and each Warp Beam
     purchase panel. The log grows with the page (no internal vertical scroll/cap) so every
     row is visible without a nested scrollbar; only horizontal overflow (for wide tables on
     narrow screens) scrolls within the box. Header row stays pinned for when it does. */
  .log-scroll{
    overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; /* y hidden: never traps a vertical swipe */
    border:1px solid var(--line); border-radius:12px;

  .chq-actions{ display:flex; flex-wrap:wrap; gap:6px; }

     Edit/Remove buttons on their own row underneath. No sideways swiping to read one entry.
     Wide screens keep the normal table; Settings → Appearance can switch phones back to tables. */
  @media (max-width:720px){
    html:not([data-logs="table"]) .log-scroll.log-cards{ border:none; border-radius:0; overflow:visible; }
    html:not([data-logs="table"]) .log-cards table{ display:block; width:100%; min-width:0; }
    html:not([data-logs="table"]) .log-cards thead{ display:none; }
    html:not([data-logs="table"]) .log-cards tbody{ display:block; }
    html:not([data-logs="table"]) .log-cards tr{
      display:grid; grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); gap:10px 8px;
      padding:12px 12px; margin-bottom:10px; background:var(--card);
      border:1px solid var(--line); border-radius:12px;
    }
    html:not([data-logs="table"]) .log-cards td{
      display:block; border:0; padding:0; min-width:0; white-space:normal; overflow-wrap:break-word; font-size:13.5px;
    }
    html:not([data-logs="table"]) .log-cards td[data-label]::before{
      content:attr(data-label); display:block; margin-bottom:2px;
      font-size:10.5px; font-weight:700; color:var(--ink-soft); letter-spacing:0.2px;
    }
    html:not([data-logs="table"]) .log-cards td:first-child{ font-weight:700; }
    html:not([data-logs="table"]) .log-cards td[data-empty]{ display:none; }
    html:not([data-logs="table"]) .log-cards td.act{
      grid-column:1 / -1; padding-top:8px; border-top:1px solid var(--line); font-weight:400;
      display:flex; flex-wrap:wrap; justify-content:flex-end; align-items:center; gap:8px;
    }
    html:not([data-logs="table"]) .log-cards td.act .row-actions{ display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; }
    html:not([data-logs="table"]) .log-cards tr:hover td{ background:none; }

       width — instead of ragged, right-shoved rows of different lengths. */
    html:not([data-logs="table"]) .log-cards .chq-actions{
      display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px; width:100%;
    }
    html:not([data-logs="table"]) .log-cards .chq-actions button{
      width:100%; margin:0; white-space:normal; line-height:1.25; padding-left:10px; padding-right:10px;

  }
  .log-scroll thead th{ background:var(--paper-dim); } /* was position:sticky, but this box never scrolls vertically, so it only cost extra layers */
  /* Live-calculated amount previews (Sale/Warp/Weft "Amount", Recovery "Total") — shown
