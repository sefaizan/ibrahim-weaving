<!-- RELEASE CHECKLIST — every fix/release must bump ALL of these together, or the app-build
     meta tag below, the header's visible version badge, package.json, and the service worker's
     CACHE_VERSION will disagree with each other:
       1. This app-build content (any short unique label works, e.g. a date + fix name).
       2. The #appVersionTag text — a small pill at the right end of the header (under the "Week Rs …" pill),
          <header class="appbar"> below — plain "vX.Y.Z", so opening the app confirms which
          build is actually running, even if the "app updated" toast doesn't fire (e.g. after
          a fresh install/reinstall, which starts with no prior build to compare against).
       3. "version" in package.json — same X.Y.Z, one patch number higher than the last release
          (e.g. 3.11.8 -> 3.11.9 for the next fix).
       4. CACHE_VERSION in service-worker.js (e.g. 'v50' -> 'v51') — bump on every release,
          not just ones that add/remove files, so phones actually fetch the new set.
     DELIVERY — after every change, provide TWO zips, not one:
       1. Changed files only (just the files actually touched this round) — for deploying
          straight over the existing repo on github.com without re-uploading everything.
       2. The full app (every file) — a complete replacement copy. -->

<script>
  // Applies the saved theme before first paint, straight from localStorage (not the app's
  // window.storage-backed DATA, which loads async later) — this is a pure device/UI
  // preference, not ledger data, so it isn't part of Backup/Restore either. Wrapped in
  // try/catch since localStorage can throw in some embedded/locked-down webviews.
  try{
    var t = localStorage.getItem('khata-theme');
    if(t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    // Device preference: log tables as compact cards on phones (default) or classic tables.
    if(localStorage.getItem('khata-logs') === 'table') document.documentElement.setAttribute('data-logs', 'table');
  }catch(e){}
</script>

  /* On phones, tables were being squeezed to the screen width, forcing every column into
     a cramped multi-line mess. Instead: let each table size itself naturally (auto width,
     no forced wrapping) and let the card scroll sideways for whatever doesn't fit — the

     (no pinned/sticky column). */
  @media (max-width:720px){
    .card{ overflow-x:auto; -webkit-overflow-scrolling:touch; } /* fallback for browsers without :has() */
    /* overflow-x:auto silently turns overflow-y into auto as well, so EVERY card became its own

    @supports selector(:has(*)){

  .log-scroll{

  .calc-amount{

  .rc-info[hidden]{ display:none; }

  /* Row of action buttons at the bottom of an entry form (Add / Add & next / Cancel Edit).
     Buttons used to just flow inline, each with its own margin-top — fine with two, but a
     third button (e.g. Production's "Add & next loom" + "Add Entry" + "Cancel Edit") could
     wrap unevenly and looked misaligned. This gives them one shared top margin and a uniform
     gap instead, and cancels each button's own margin-top so they line up on one baseline. */
  .form-actions{ display:flex; align-items:center; gap:10px 12px; flex-wrap:wrap; margin-top:14px; }

  /* Floating Backup & Restore shortcut — stays fixed over every tab/screen so a backup is
     always one tap away, instead of having to navigate through the tab bar first. */
  .fab-backup{
    position:absolute; overflow:hidden; right:18px; bottom:22px; z-index:45;
    width:56px; height:56px; border-radius:16px; border:none;
    background:var(--gold); color:#2C160A;
    font-size:22px; line-height:1; cursor:pointer;
    box-shadow:var(--elev-3);
    display:flex; align-items:center; justify-content:center;
    transition:opacity .15s ease, transform .15s ease;
  }
  /* While a page is actively scrolling, a table's pagination or Export CSV button can end up
     sitting right under this fixed shortcut (worst on pages with several long lists, like
     Wages) — a pile of buttons fighting for the same tap. Tucking the fab away while the page is
     moving, and only while it's moving, keeps it out of the way exactly when it would otherwise
     block a tap, without hiding it the rest of the time. See wireScrollAwareFab (lock-init.js). */
  .fab-backup.fab-scroll-hide{ opacity:0; transform:scale(0.8); pointer-events:none; }
  .fab-backup .icon{ font-size:24px; }
  .fab-backup:hover{ background:#D98A4B; }
  .fab-backup:active{ transform:scale(0.94); }
  /* "Needs backup" badge (see setFabNeedsBackup, js/autobackup.js): a dot rather than
     recoloring the whole button, so it reads as a notification ("something's waiting") rather
     than a warning ("something's wrong") — but it pulses continuously (see fabBackupPulse
     below) so it's still easy to notice rather than blending into the button's own gold/red
     corner. The ring around the dot is a fixed light color (not var(--gold)) on purpose: the
     ring used to match the button's own background exactly, so the pulse's scale-up all but
     vanished into the button behind it instead of standing out. Tapping the button while this
     shows emails a backup directly instead of opening Backup & Restore — see fabBackup.onclick
     in js/lock-init.js. */
  .fab-backup.needs-backup::after{
    content:''; position:absolute; top:3px; right:3px; width:15px; height:15px;
    border-radius:50%; background:var(--red); border:2px solid #FFF3E0;
    transform-origin:center; animation:fabBackupPulse 1.4s ease-in-out infinite;
  }
  @keyframes fabBackupPulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.35); } }
  @media (prefers-reduced-motion: reduce){ .fab-backup.needs-backup::after{ animation:none; } }
  /* While a tap-triggered send is in flight, dim the button and ignore further taps — the same
     visual treatment as fab-scroll-hide, minus hiding it entirely, so it's clear something is
     happening without the button vanishing mid-send. */
  .fab-backup.fab-busy{ opacity:0.55; pointer-events:none; }

  .ripple{

  /* ===== v3.17.86 — Presentation polish (CSS-only, final override; no IDs, data or logic touched) ===== */

  .ov-sticky{ height:0; padding:0; margin:0; border:0; background:none; align-items:flex-start; overflow:visible; opacity:0; pointer-events:none; transform:translateY(-8px); transition:opacity .18s ease, transform .18s ease; font-weight:700; color:var(--ink-soft); }

(function(){
  function check(){
    if(typeof switchTab === 'function' && typeof DATA === 'object') return;
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#EDEFF1;padding:24px;box-sizing:border-box;font-family:Roboto,Arial,sans-serif';
    d.innerHTML = '<div style="max-width:360px;text-align:center;background:#fff;border-radius:20px;padding:28px 22px;box-shadow:0 2px 12px rgba(0,0,0,.12)"><div style="font-size:44px">\uD83D\uDCF5</div>'
      + '<h1 style="font-size:20px;margin:10px 0 8px;color:#163B3D">Please connect to the internet to open this app.</h1><p style="direction:rtl;font-size:16px;margin:6px 0">براہ کرم ایپ کھولنے کے لیے انٹرنیٹ سے جڑیں۔</p>'
      + '<p style="font-size:14.5px;line-height:1.5;color:#626B72;margin:6px 0">The app could not be loaded because there is no internet connection. Your ledger data is safe on this phone. Once you are connected, reopen the app. After it has loaded once, it works without internet.</p>'
      + '<button onclick="location.reload()" style="margin-top:16px;min-height:48px;padding:0 28px;border:0;border-radius:24px;background:#204E52;color:#fff;font-size:16px;font-weight:700">Try again</button></div>';
    document.body.appendChild(d);
  }
  window.addEventListener('load', function(){ setTimeout(check, 400); });
})();
</script>
<script>
if('serviceWorker' in navigator){
  const hadController = !!navigator.serviceWorker.controller;
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js', {updateViaCache:'none'}).then(reg=>{
      reg.update().catch(()=>{});
      document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') reg.update().catch(()=>{}); });
    }).catch(()=>{ /* offline support just won't be available */ });
  });
  // A new service worker took over (whole new file set installed) -> restart on it automatically.
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(hadController && typeof showUpdateBar === 'function') showUpdateBar(); });
}
</script>
